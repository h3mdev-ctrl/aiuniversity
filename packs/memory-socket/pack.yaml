# memory-socket -- wire memory into the agent LIFECYCLE, not just onto disk.
#
# The `memory` pack builds the STORE: a memory/ folder, an always-loaded resolver
# index, a doctor that keeps every note reachable. This pack builds the WIRING:
# the lifecycle points where that store is read from and written to.
#
# The distinction is the whole lesson. A store with no sockets is a library
# nobody walks into -- it audits perfectly and changes nothing. Most people who
# say "I set up memory for Claude" have built exactly that.
#
# Modelled on nousresearch/hermes-agent's MemoryProvider, which defines the same
# attachment points as explicit methods (prefetch, on_pre_compress, on_delegation,
# on_session_end). Claude Code exposes the same surface as hooks. Different
# harness, same sockets.
#
# Commands run from the repo root (where packs/ lives).
name: memory-socket
version: 0.1.0
steps:
  - id: store-present
    instruction: >
      A socket needs something to plug into. This runs the memory module end to
      end -- the memory/ folder, the always-loaded index, the doctor, and the
      cold-recall probe. If you have already run the memory pack this passes
      immediately; if not, it sets the store up now.
    module: memory

  - id: sockets-mapped
    instruction: >
      See the whole surface at once. This lists all six sockets, the lifecycle
      event each attaches to, whether it is required, and whether anything is
      currently plugged in. Read the DARK rows -- each one is a place your agent
      is currently forgetting something. Nothing is changed by this step.
    check:
      type: contains
      cmd: python packs/memory-socket/files/socket_doctor.py --list
      expect: "sockets wired"
    on_fail: >
      The doctor could not read your settings.json (exit 2). Check that
      ~/.claude/settings.json exists and is valid JSON -- `python -c "import
      json,pathlib;json.loads(pathlib.Path.home().joinpath('.claude/settings.json').read_text())"`
      will name the parse error. Set CLAUDE_HOME if your config lives elsewhere.

  - id: recall-wired
    instruction: >
      Plug in the RECALL socket (UserPromptSubmit) -- retrieve the memories
      relevant to each prompt before the model answers. This is the one socket
      that is not optional: without it the store is never read, and every other
      socket just feeds a folder nobody opens.
    check:
      type: command_succeeds
      cmd: python packs/memory-socket/files/socket_doctor.py --socket recall
    on_fail: >
      Nothing is registered on UserPromptSubmit. Copy
      packs/memory-socket/files/examples/recall_on_prompt.py into your hooks
      folder and register it on UserPromptSubmit in ~/.claude/settings.json.
      Read the file first -- the two comment blocks (the absolute relevance floor,
      and per-project store resolution) are the parts people get wrong.

  - id: recall-live
    instruction: >
      Prove RECALL actually fires. Registration is not evidence -- a hook whose
      script was deleted or whose store does not resolve is registered and
      silent, and passes every presence audit. This EXECUTES it with a real
      prompt and demands output. Run it from a project that HAS memory.
    check:
      type: contains
      cmd: python packs/memory-socket/files/socket_doctor.py --probe recall
      expect: "LIVE"
    on_fail: >
      The hook is registered but emitted nothing. Two causes, in order of
      likelihood: (1) you are running from a directory with no memory/ folder --
      cd into a project that has one and re-probe; (2) the hook genuinely fails.
      Run it by hand to see:
        echo '{"prompt":"how do I set up the memory index","cwd":"."}' | python <your-hook>.py
      A hook that prints nothing here is dark no matter what settings.json says.

  - id: identity-wired
    instruction: >
      Plug in the IDENTITY socket (SessionStart) -- inject the always-on model of
      the user. This is a separate socket from recall on purpose: retrieval
      matches the PROMPT, so a user model delivered by retrieval would only ever
      surface when the user talked about themselves.
    check:
      type: command_succeeds
      cmd: python packs/memory-socket/files/socket_doctor.py --socket identity
    on_fail: >
      Nothing is registered on SessionStart. Copy
      packs/memory-socket/files/examples/identity_on_start.py into your hooks
      folder and register it on SessionStart. It expects a capped
      user_representation.md in your memory folder; if you do not have one yet,
      the hook stays silent by design rather than breaking startup.

  - id: salvage-wired
    instruction: >
      Plug in the SALVAGE + RESTORE pair (PreCompact / PostCompact). Compaction
      discards the session's measurements, decisions and corrections while
      keeping the static rules. Salvage distils the doomed window before it goes;
      restore re-injects it after. Optional -- but this is where long sessions
      quietly lose the most.
    check:
      type: command_succeeds
      cmd: python packs/memory-socket/files/socket_doctor.py --socket salvage
    on_fail: >
      Nothing is registered on PreCompact. Copy BOTH
      packs/memory-socket/files/examples/salvage_pre_compact.py and
      restore_post_compact.py -- they are one mechanism split across two events,
      and either half alone does nothing useful. Register them on PreCompact and
      PostCompact respectively.

  - id: salvage-survives-rekey
    instruction: >
      Prove the SALVAGE chain survives what it exists for. The harness reassigns
      the session id across a compaction, so a carry file keyed on session id is
      written under one id and looked up under another -- and the restore hook
      reports an honest "no carry-forward found", which looks like a benign miss
      and is actually the feature being dead. Ours had never worked once. Write
      a carry under one id, read it back under a DIFFERENT one, and demand the
      content survives.
    check:
      type: contains
      cmd: python packs/memory-socket/files/socket_doctor.py --probe restore
      expect: "LIVE"
    on_fail: >
      Your restore hook returned nothing. If it keys the carry file on
      session_id, that is the bug -- key on the working directory instead
      (hashed, so sibling worktrees cannot collide). See
      files/examples/restore_post_compact.py and the README section
      "Audit yourself against the whole contract". Do NOT fix this by falling
      back to "the newest carry file": that leaks another session's notes into
      this one.
      .
      CWD IS THE RIGHT LOOKUP KEY, BUT DO NOT *MERGE* ACROSS IT (added
      2026-08-28). A cwd key matches every session that ever ran at that path,
      so folding the previous carry INTO the new digest cross-contaminates two
      conversations -- and it needs no overlap at all:
      session A compacts at 10:00 and writes the carry; session B compacts at
      11:00, reads it, and merges A's lines in under the header "established
      facts of THIS session". Both are recent, so a staleness TTL does not catch
      it, and two sessions in one worktree an hour apart is an ordinary day.
      .
      Carry by REFERENCE, not by absorption: write each window's digest to the
      SESSION's own scratchpad (keyed by session id, therefore unique by
      construction) and have the carry NAME the previous window's path instead of
      inlining it. You lose inline iterative re-compression -- earlier windows
      are one hop back down the chain rather than restated -- and you gain the
      guarantee that another conversation's content can never appear in yours. A
      correct pointer beats a convenient lie. If a pointer ever does come from
      another session you get a clearly-labelled path you can ignore, rather than
      silent content in your context.

  - id: learning-loop-votes
    instruction: >
      Confirm the trust loop actually VOTES. Porting the trust model is easy and
      wiring a voter is the part that gets skipped -- ours ran for months with
      607 memories, two distinct trust values and zero votes, which means nothing
      was ever pruned and every false fire recurred forever. If your store shows
      one or two trust values across the whole corpus, you have a decoration, not
      a loop.
    check:
      type: command_succeeds
      cmd: python packs/memory-socket/files/socket_doctor.py --socket salvage
    on_fail: >
      This step is a READING step as much as a check: open
      files/examples/learn_on_compact.py and read the four ways an inferred
      vote signal lies (benchmark contamination, common-word evidence,
      corpus-rarity, timezone skew). Then wire a voter at PreCompact, where the
      firing log and the transcript of what happened next both still exist.
      Make it timid and reversible before you make it clever.

  - id: no-silent-sockets
    instruction: >
      The audit that matters: every socket you have plugged in must actually
      EMIT. This is the difference between a memory system and the appearance of
      one. A registered-but-silent hook is worse than an unwired one, because it
      passes every check you would think to run.
    check:
      type: command_succeeds
      cmd: python packs/memory-socket/files/socket_doctor.py --check
    on_fail: >
      A required socket is dark. Run
        python packs/memory-socket/files/socket_doctor.py --list
      to see which, then --probe <socket> on each wired one to find the silent
      ones. Fix the dark required sockets first (recall, identity); the optional
      ones can follow.
